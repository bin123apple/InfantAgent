# Optional, if not provided, the Global LLM will be used
[planning_llm]
model = "claude-sonnet-4-20250514"
api_key = "" # YOUR API KEY

# Optional, if not provided, the Global LLM will be used
[classification_llm]
model = "claude-sonnet-4-20250514"
api_key = "" # YOUR API KEY

# Optional, if not provided, the Global LLM will be used
[execution_llm]
model = "claude-sonnet-4-20250514"
api_key = "" # YOUR API KEY

# Visual Grounding model served by the vLLM container (OpenAI-compatible API).
# The "openai/" prefix tells litellm to use the OpenAI provider with our custom base_url.
[vg_llm]
model_oss = "openai/ByteDance-Seed/UI-TARS-1.5-7B"
base_url_oss = "http://vllm-server:8005/v1"
api_key_oss = "infant"

# Optional, File Editing model, if not provided, the default model will be used
[fe_llm]
model = "claude-sonnet-4-20250514"

# Optional, Toolmaker model, if not provided, the default model will be used
[tm_llm]
model = "claude-sonnet-4-20250514"

# Audio parsing model, if not provided, the default model will be used
[ap_llm]
model = "gpt-4o-audio-preview"
api_key = "" # YOUR API KEY
